{{ define "main" }}
<article class="srd-article" data-page-path="{{ .Params.srd_path }}" data-page-title-zh="{{ .Title }}" data-page-title-en="{{ .Params.title_en }}">
  <nav class="breadcrumbs" id="breadcrumbs" aria-label="当前位置"></nav>
  <header class="article-header" id="top">
    <p class="eyebrow"><span class="lang-zh">系统参考文档</span><span class="lang-en">System Reference Document</span></p>
    <h1><span class="lang-zh">{{ .Title }}</span><span class="lang-en">{{ .Params.title_en }}</span></h1>
  </header>
  <div class="article-body">{{ .Content }}</div>
  <div class="article-tools"><button class="text-button" id="feedback-button" type="button"><span class="lang-zh">报告本页问题</span><span class="lang-en">Report an issue on this page</span></button></div>
  <nav class="page-sequence" id="page-sequence" aria-label="前后页"></nav>
</article>
{{ end }}
