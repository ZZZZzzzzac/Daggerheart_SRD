# Place these locations before the public /SRD/ location.
# Also map the module extension in /etc/nginx/mime.types:
# application/javascript  js mjs;

location ^~ /SRD/edit/ {
    auth_basic "DaggerheartEditor";
    auth_basic_user_file /etc/nginx/.htpasswd_daggerheart;
    alias /var/www/SRD/public/edit/;
}

location ^~ /SRD/admin/ {
    auth_basic "Daggerheart Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_daggerheart;
    alias /var/www/SRD/public/admin/;
}

location = /SRD/api/save {
    auth_basic "DaggerheartEditor";
    auth_basic_user_file /etc/nginx/.htpasswd_daggerheart;
    proxy_pass http://127.0.0.1:5000/api/save;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /SRD/api/page-list {
    auth_basic "DaggerheartEditor";
    auth_basic_user_file /etc/nginx/.htpasswd_daggerheart;
    proxy_pass http://127.0.0.1:5000/api/page-list;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /SRD/api/get-file {
    auth_basic "DaggerheartEditor";
    auth_basic_user_file /etc/nginx/.htpasswd_daggerheart;
    proxy_pass http://127.0.0.1:5000/api/get-file;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /SRD/api/publish-status {
    auth_basic "DaggerheartEditor";
    auth_basic_user_file /etc/nginx/.htpasswd_daggerheart;
    proxy_pass http://127.0.0.1:5000/api/publish-status;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /SRD/api/admin/ {
    auth_basic "Daggerheart Admin";
    auth_basic_user_file /etc/nginx/.htpasswd_daggerheart;
    proxy_pass http://127.0.0.1:5000/api/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /SRD/api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
