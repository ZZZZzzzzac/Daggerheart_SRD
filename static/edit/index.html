<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="匕首之心 SRD 在线编辑器">
  <meta name="theme-color" content="#f4efe5">
  <title>SRD 在线编辑器</title>
  <link rel="stylesheet" href="../css/site.css?v=20260903j">
  <link rel="stylesheet" href="editor.css?v=20260903h">
</head>
<body class="editor-page show-zh" data-site-index="../generated/site-index.json">
  <header class="site-header editor-site-header">
    <button class="icon-button menu-button" id="menu-button" type="button" aria-label="打开目录" title="目录"><span></span><span></span><span></span></button>
    <a class="wordmark" href="../">
      <span class="wordmark-mark">DH</span>
      <span class="wordmark-text"><b>匕首之心</b><small>HTML SRD · 编辑</small></span>
    </a>
    <div class="header-actions editor-header-actions">
      <a class="editor-current" id="reader-link" href="../"><small>正在编辑</small><b id="editor-document-label">正在读取章节…</b></a>
      <span class="pending-count" id="pending-count">待发布 0 页</span>
      <span class="editor-status" id="save-status">正在读取目录…</span>
      <button class="compact-button" id="language-button" type="button" title="切换编辑语言">中文</button>
      <button class="secondary-button editor-sage-button" id="sage-btn" type="button">插入贤者恩泽</button>
      <button class="primary-button" id="save-btn" type="button" disabled>保存并发布</button>
    </div>
  </header>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="site-sidebar" id="site-sidebar">
    <div class="sidebar-heading">
      <p class="sidebar-label">规则目录</p>
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="关闭目录">×</button>
    </div>
    <nav class="contents-tree" id="contents-tree" aria-label="整站目录">
      <p class="sidebar-loading">正在整理目录…</p>
    </nav>
    <div class="sidebar-meta">
      <a id="sidebar-reader-link" href="../">返回当前正文</a>
      <a href="../admin/">反馈收件箱</a>
    </div>
  </aside>

  <main class="site-main editor-main" id="main-content">
    <div class="editor-shell" data-page-path="">
      <div class="editor-workspace">
        <section class="editor-pane">
          <div class="pane-title"><span>Markdown 原文</span><small id="document-version"></small></div>
          <textarea id="editor-textarea" spellcheck="false" disabled></textarea>
        </section>
        <section class="preview-pane">
          <div class="pane-title"><span>正式规则预览</span><small id="preview-status"></small></div>
          <article class="article-body preview-content" id="preview"></article>
        </section>
      </div>

      <section class="conflict-panel" id="conflict-panel" hidden>
        <div><p class="eyebrow">版本冲突</p><h2>服务器上的页面已经变化</h2><p>左侧保留你的内容。下面是服务器当前版本，请人工合并后重新保存。</p></div>
        <button id="accept-server" class="secondary-button" type="button">改用服务器版本</button>
        <textarea id="server-content" readonly></textarea>
      </section>
    </div>
  </main>

  <dialog id="publish-dialog">
    <form class="dialog-shell publish-form" id="publish-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">统一发布</p><h2>确认本次变更</h2></div>
        <button class="dialog-close" type="button" id="publish-close" aria-label="关闭">×</button>
      </div>
      <p>以下页面将经过版本检查、完整构建和校验，并形成一个 Git 版本。</p>
      <ul class="publish-list" id="publish-list"></ul>
      <label>编辑者名称<input id="publish-name" maxlength="80" autocomplete="name" required></label>
      <div class="form-actions">
        <p id="publish-error"></p>
        <button class="secondary-button" type="button" id="publish-cancel">取消</button>
        <button class="primary-button" type="submit">确认发布</button>
      </div>
    </form>
  </dialog>
  <script src="editor.js?v=20260903j" defer></script>
</body>
</html>
