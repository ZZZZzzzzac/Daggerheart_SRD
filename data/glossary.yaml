# 简述依据本站 SRD 正文编写；修改规则时同时检查本表。
# 中英文标题历史上存在错位，anchor 必须按实际小节分别核对。
enabled: true
terms:
  - id: hope
    zh: 希望点
    en: Hope
    target: core-mechanics
    anchor: {zh: hope-fear, en: hope}
    summary:
      zh: 玩家用于帮助盟友、使用经历和激活特性等的资源。创建角色时有 2 点，最多持有 6 点，可跨场次保留。各用途的消耗见完整规则。
      en: A player resource used to help allies, utilize Experiences, and activate features. Start with 2, hold up to 6, and keep it between sessions. Costs depend on the use.
  - id: fear
    zh: 恐惧点
    en: Fear
    target: core-mechanics
    anchor: {zh: evasion, en: fear}
    summary:
      zh: 玩家掷出恐惧结果时，主持人获得 1 恐惧点。可花费以执行或强化主持人行动、启用恐惧特性；最多持有 12 点，可跨场次保留。
      en: The GM gains Fear when a player rolls with Fear and can spend it on GM moves or Fear Features. Hold up to 12 and keep it between sessions.
  - id: stress
    zh: 压力点
    en: Stress
    target: core-mechanics
    anchor: {zh: attack-rolls, en: stress}
    summary:
      zh: 代表角色的精神、身体与情绪负荷。标记最后一点后陷入脆弱，直到清除至少 1 点。被要求标记却无法标记时，改为标记 1 生命点；已满时不能使用要求标记压力点的动作。
      en: Mental, physical, and emotional strain. Marking the last Stress makes you Vulnerable until you clear at least 1. If required to mark Stress but unable, mark 1 HP instead. With all Stress marked, you cannot use moves that require marking it.
  - id: hit-points
    zh: 生命点
    en: Hit Points
    aliases: {zh: [], en: [HP, Hit Point]}
    target: core-mechanics
    anchor: {zh: stress, en: hit-points-damage-thresholds}
    summary:
      zh: 代表承受物理伤害的能力。根据伤害阈值标记生命点；标记最后一点时被击败，玩家角色必须执行死亡行动。
      en: Capacity to withstand physical injury. Damage thresholds determine how many HP you mark. Marking the last HP causes a character to fall; a PC then makes a death move.
  - id: damage-thresholds
    zh: 伤害阈值
    en: Damage Thresholds
    aliases: {zh: [], en: [Damage Threshold]}
    target: core-mechanics
    anchor: {zh: stress, en: hit-points-damage-thresholds}
    summary:
      zh: 用于把伤害换算为生命点标记。一般规则下，低于重度阈值标记 1 点，达到重度阈值标记 2 点，达到严重阈值标记 3 点；伤害为 0 或更低则不标记。例外见完整规则。
      en: Convert incoming damage to HP marks. Normally mark 1 below Major, 2 at or above Major, or 3 at or above Severe. Damage reduced to 0 or less marks none. See the full rule for exceptions.
  - id: evasion
    zh: 闪避值
    en: Evasion
    target: core-mechanics
    anchor: {zh: optional-rule-massive-damage, en: evasion}
    summary:
      zh: 针对玩家角色掷骰时使用的难度值。基础值由职业决定，并可受到其他效果调整。攻击敌人时使用敌人的难度值。
      en: The Difficulty for rolls against a PC, based on their class and modified by relevant effects. Attacks against adversaries use the adversary's Difficulty instead.
  - id: armor-slots
    zh: 护甲槽
    en: Armor Slots
    aliases: {zh: [], en: [Armor Slot]}
    target: core-mechanics/equipment
    anchor: reducing-incoming-damage
    summary:
      zh: 受到伤害时，可标记 1 护甲槽，使本次需要标记的生命点减少 1 点。护甲值为 0 时不能标记护甲槽；临时护甲值加值提供的额外槽会随效果结束而失去。
      en: When taking damage, mark 1 Armor Slot to reduce the HP you would mark by 1. You cannot mark slots with an Armor Score of 0. Extra slots from temporary Armor Score bonuses last only as long as the effect.
  - id: armor-score
    zh: 护甲值
    en: Armor Score
    target: core-mechanics/equipment
    anchor: armor
    summary:
      zh: 决定可使用的护甲槽数量。基础护甲值来自所穿护甲，再加上适用加值；玩家角色的护甲值不能超过 12。
      en: Determines available Armor Slots. Start with the equipped armor's base score and apply bonuses. A PC's Armor Score cannot exceed 12.
  - id: advantage
    zh: 优势
    en: Advantage
    target: core-mechanics
    anchor: advantage-disadvantage
    summary:
      zh: 动作或反应掷骰时，加入 d6 优势骰并把骰值加到总结果。同一骰池中的优势与劣势逐一抵消；帮助盟友等外部来源的处理见完整规则。
      en: Add a d6 advantage die to an action or reaction roll and add its result to the total. Advantage and disadvantage cancel one-for-one within the same pool; outside sources such as Help an Ally have additional rules.
  - id: disadvantage
    zh: 劣势
    en: Disadvantage
    target: core-mechanics
    anchor: advantage-disadvantage
    summary:
      zh: 动作或反应掷骰时，加入 d6 劣势骰并从总结果减去骰值。同一骰池中的优势与劣势逐一抵消。
      en: Add a d6 disadvantage die to an action or reaction roll and subtract its result from the total. Advantage and disadvantage cancel one-for-one within the same pool.
  - id: hidden
    zh: 隐藏
    en: Hidden
    target: core-mechanics
    anchor: {zh: vulnerable, en: hidden}
    summary:
      zh: 处于所有敌人视线之外且敌人不知道你的位置时获得。以隐藏生物为目标的掷骰具有劣势。被敌人看见、主动进入敌人视线或进行攻击时结束。
      en: Gained when out of all enemies' sight and your location is unknown to them. Rolls against a Hidden creature have disadvantage. It ends when an enemy can see you, you enter their sight, or you attack.
  - id: restrained
    zh: 束缚
    en: Restrained
    target: core-mechanics
    anchor: {zh: temporary-tags-special-conditions, en: restrained}
    summary:
      zh: 无法移动，但仍可在当前位置执行动作。如何解除取决于施加此状态的效果。
      en: You cannot move, but can still act from your current position. The effect imposing the condition determines how it can be cleared.
  - id: vulnerable
    zh: 脆弱
    en: Vulnerable
    target: core-mechanics
    anchor: {zh: downtime, en: vulnerable}
    summary:
      zh: 所有以脆弱生物为目标的掷骰都具有优势。如何解除取决于施加此状态的效果。
      en: All rolls targeting a Vulnerable creature have advantage. The effect imposing the condition determines how it can be cleared.
  - id: action-rolls
    zh: 动作掷骰
    en: Action Rolls
    aliases: {zh: [], en: [Action Roll]}
    target: core-mechanics
    anchor: action-rolls
    summary:
      zh: 有挑战或风险的行动需要动作掷骰：掷二元骰，加上调整值，与难度比较。较高的二元骰决定希望或恐惧结果；两骰相同为关键成功。具体结果与例外见完整规则。
      en: For challenging or risky actions, roll the Duality Dice, add modifiers, and compare with the Difficulty. The higher Duality Die determines Hope or Fear; matching dice give a critical success. See the full rule for outcomes and exceptions.
