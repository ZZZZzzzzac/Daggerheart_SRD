# 名称来自 data/translation-terms.json；解释只允许对应正文的完整原文段落或列表项。
# 不得自行概括。改写文案必须先经用户审核；当前构建仅接受可核对的原文摘录。
enabled: true
terms:
- id: hope
  translation_term: Hope
  target: core-mechanics
  anchor:
    zh: hope-fear
    en: hope
  quote:
    zh: 每位玩家角色在创建角色时会以 2 希望点开始游戏，在游戏过程中还会获得更多希望点。一位玩家角色最多能同时拥有 6 希望点，且希望点能在不同场次间得以保留。
    en: Every PC starts with 2 Hope at character creation and gains more throughout play. A PC can have a maximum
      of 6 Hope at one time, and Hope carries over between sessions.
- id: fear
  translation_term: Fear
  target: core-mechanics
  anchor:
    zh: evasion
    en: fear
  quote:
    zh: 每当玩家掷出恐惧结果时，游戏主持人便获得 1 恐惧点。游戏主持人可随时花费恐惧点以执行或强化一次游戏主持人行动，或启用一个恐惧特性。游戏主持人同时最多可持有 12 恐惧点，且恐惧点会在多个游戏场次之间保留。
    en: The GM gains Fear whenever a player rolls with Fear and can spend Fear at any time to make or enhance a
      GM move or to use a Fear Feature. The GM can have up to 12 Fear at one time. Fear carries over between sessions.
- id: stress
  translation_term: Stress
  target: core-mechanics
  anchor:
    zh: attack-rolls
    en: stress
  quote:
    zh: 压力点 代表角色所能承受的精神、身体与情绪负荷。一些特殊能力或效果要求角色标记压力点，游戏主持人也通过一次游戏主持人行动，或为了表示一次动作掷骰的代价、复杂性或后果，要求玩家角色标记压力点。
    en: Stress represents how much mental, physical, and emotional strain a character can endure. Some special abilities
      or effects require the character activating them to mark Stress, and the GM can require a PC to mark Stress
      as a GM move or to represent the cost, complication, or consequence of an action roll.
- id: hit-points
  translation_term: Hit Point
  target: core-mechanics
  anchor:
    zh: stress
    en: hit-points-damage-thresholds
  quote:
    zh: '生命点 (HP) 代表角色承受物理伤害的能力。当角色受到伤害时，会根据其伤害阈值标记 1 至 3 生命点：


      若最终伤害大于或等于角色的严重伤害阈值，则标记 3 生命点。


      若最终伤害大于或等于角色的重度伤害阈值但低于严重伤害阈值，则标记 2 生命点。


      若最终伤害低于角色的重度伤害阈值，则标记 1 生命点。


      若伤害被减至 0 或更低，则不标记生命点。'
    en: 'Hit Points (HP) represent a character''s ability to withstand physical injury. When a character takes damage,
      they mark 1 to 3 HP, based on their damage thresholds:


      If the final damage is at or above the character''s Severe damage threshold, they mark 3 HP.


      If the final damage is at or above the character''s Major damage threshold but below their Severe damage threshold,
      they mark 2 HP.


      If the final damage is below the character''s Major damage threshold, they mark 1 HP.


      If incoming damage is ever reduced to 0 or less, no HP is marked.'
- id: damage-thresholds
  translation_term: Damage Threshold
  target: core-mechanics
  anchor:
    zh: stress
    en: hit-points-damage-thresholds
  quote:
    zh: '生命点 (HP) 代表角色承受物理伤害的能力。当角色受到伤害时，会根据其伤害阈值标记 1 至 3 生命点：


      若最终伤害大于或等于角色的严重伤害阈值，则标记 3 生命点。


      若最终伤害大于或等于角色的重度伤害阈值但低于严重伤害阈值，则标记 2 生命点。


      若最终伤害低于角色的重度伤害阈值，则标记 1 生命点。


      若伤害被减至 0 或更低，则不标记生命点。'
    en: 'Hit Points (HP) represent a character''s ability to withstand physical injury. When a character takes damage,
      they mark 1 to 3 HP, based on their damage thresholds:


      If the final damage is at or above the character''s Severe damage threshold, they mark 3 HP.


      If the final damage is at or above the character''s Major damage threshold but below their Severe damage threshold,
      they mark 2 HP.


      If the final damage is below the character''s Major damage threshold, they mark 1 HP.


      If incoming damage is ever reduced to 0 or less, no HP is marked.'
- id: evasion
  translation_term: Evasion
  target: core-mechanics
  anchor:
    zh: optional-rule-massive-damage
    en: evasion
  quote:
    zh: 闪避值 代表角色躲避攻击及其他负面效果的能力。任何针对玩家角色进行的掷骰，其难度值等于该目标的闪避值。玩家角色的基础闪避值由其职业决定，但可被领域卡、装备、状态或其他效果所调整。
    en: Evasion represents a character's ability to avoid attacks and other unwanted effects. Any roll made against
      a PC has a Difficulty equal to the target's Evasion. A PC's base Evasion is determined by their class, but
      can be modified by domain cards, equipment, conditions, and other effects.
- id: armor-slots
  translation_term: Armor Slot
  target: core-mechanics/equipment
  anchor: reducing-incoming-damage
  quote:
    zh: 当你受到伤害时，你可以标记 1 护甲槽来将需要标记的生命点数量减一。当角色的护甲值为 0 时则不能标记护甲槽。如果一个效果临时增加了你的护甲值，它也会增加你同样数量的可用护甲槽，而当这个效果结束时，临时的护甲槽也将移除。
    en: When you take damage, you can mark one Armor Slot to reduce the number of Hit Points you would mark by one.
      If your character has an Armor Score of 0, you can't mark Armor Slots. If an effect temporarily increases
      your Armor Score, it increases your available Armor Slots by the same amount; when the effect ends, so does
      the availability of these Armor Slots.
- id: armor-score
  translation_term: Armor Score
  target: core-mechanics/equipment
  anchor: armor
  quote:
    zh: 护甲的基础护甲值代表其提供给穿戴者的护甲槽。总护甲值等于护甲的基础护甲值加上其他额外加值。角色的护甲值无法超过 12 。
    en: An armor's base armor score indicates how many Armor Slots it provides its wearer before additional bonuses
      are added to calculate their total Armor Score. A PC's Armor Score can't exceed 12.
- id: advantage
  translation_term: Advantage
  target: core-mechanics
  anchor: advantage-disadvantage
  quote:
    zh: 优势代表你能增加成功几率的机遇。当你获得掷骰优势时，你在总结果中加上一个 d6 优势骰。
    en: Advantage represents an opportunity that you seize to increase your chances of success. When you roll with
      advantage, you roll a d6 advantage die with your dice pool and add its result to your total.
- id: disadvantage
  translation_term: Disadvantage
  target: core-mechanics
  anchor: advantage-disadvantage
  quote:
    zh: 劣势代表你在尝试某个行动时面临额外的困难、艰辛或挑战。当你获得掷骰劣势时，你在总结果中减去一个 d6 劣势骰。
    en: Disadvantage represents an additional difficulty, hardship, or challenge you face when attempting an action.
      When you roll with disadvantage, you roll a d6 disadvantage die with your dice pool and subtract its result
      from your total.
- id: hidden
  translation_term: Hidden
  target: core-mechanics
  anchor:
    zh: vulnerable
    en: hidden
  quote:
    zh: 当你处于所有敌人视线之外，且敌人不知道你的位置时，你获得隐藏 状态。所有以 隐藏 状态下的生物为目标的掷骰都具有劣势。一旦敌人移动到可以看到你的位置、你主动进入他们视线或者你进行攻击，你都将脱离 隐藏 状态。
    en: While you're out of sight from all enemies and they don't otherwise know your location, you gain the Hidden
      condition. Any rolls against a Hidden creature have disadvantage. After an adversary moves to where they would
      see you, you move into their line of sight, or you make an attack, you are no longer Hidden.
- id: restrained
  translation_term: Restrained
  target: core-mechanics
  anchor:
    zh: temporary-tags-special-conditions
    en: restrained
  quote:
    zh: 处于 束缚 状态的角色无法移动，但你仍然可以在当前位置执行动作。
    en: Restrained characters can't move, but you can still take actions from their current position.
- id: vulnerable
  translation_term: Vulnerable
  target: core-mechanics
  anchor:
    zh: downtime
    en: vulnerable
  quote:
    zh: 当一个生物处于 脆弱 状态时，所有以其为目标的掷骰都具有优势。
    en: When a creature is Vulnerable, all rolls targeting them have advantage.
- id: action-rolls
  translation_term: Action Roll
  target: core-mechanics
  anchor: action-rolls
  quote:
    zh: 任何几乎注定成功，或失败会很无聊的行动都会自动成功，但任何有挑战性或风险的行动都会触发动作掷骰。
    en: Any move where success would be trivial or failure would be boring automatically succeeds, but any move
      that's difficult to accomplish or risky to attempt triggers an action roll.
